<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Expense Tracker</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="card">
  <h1>Expense Tracker</h1>
  <p class="sub" id="sub">Log in to see your expenses.</p>

  <form id="authForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <div id="pwWrap">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    </div>
    <button id="submit" type="submit">Log in</button>
  </form>

  <div class="row">
    <span><span id="toggleText">No account?</span> <button class="link" id="toggle" type="button">Sign up</button></span>
    <button class="link" id="forgot" type="button">Forgot password?</button>
  </div>
  <div id="msg" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
<footer>
  <p>&copy; 2026 Expense Tracker. All rights reserved.</p>
  <p>Contact: info@expensetrackerlc.com</p>
</footer>
</html>
