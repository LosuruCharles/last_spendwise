<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpendWise – Track what you spend</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>SpendWise</h1>
    <p>Set a monthly budget, log your expenses, and see how you're doing.</p>
  </header>

  <main>
    <!-- Dashboard: filled in by script.js -->
    <section class="dashboard" aria-labelledby="dash-title">
      <h2 id="dash-title">This month</h2>
      <div class="totals">
        <div><span class="label">Budget</span><strong id="budget-display">KES 0</strong></div>
        <div><span class="label">Spent</span><strong id="spent-display">KES 0</strong></div>
        <div><span class="label">Remaining</span><strong id="remaining-display">KES 0</strong></div>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
        <div class="bar-fill" id="progress-fill"></div>
      </div>
      <p id="status-message" class="status status-empty">Set a monthly budget to get started.</p>
    </section>

    <div class="columns">
      <div class="left">
        <section aria-labelledby="budget-title">
          <h2 id="budget-title">Monthly budget</h2>
          <form id="budget-form" class="row">
            <label for="budget-input" class="visually-hidden">Monthly budget in KES</label>
            <input type="number" id="budget-input" min="1" step="1" placeholder="e.g. 20000">
            <button type="submit">Save budget</button>
          </form>
          <p id="budget-error" class="error" role="alert"></p>
        </section>

        <section aria-labelledby="add-title">
          <h2 id="add-title">Add an expense</h2>
          <form id="expense-form">
            <label for="description">What was it for?</label>
            <input type="text" id="description" maxlength="60" placeholder="e.g. Matatu fare">

            <label for="amount">Amount (KES)</label>
            <input type="number" id="amount" min="1" step="1" placeholder="e.g. 150">

            <label for="category">Category</label>
            <select id="category">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Education">Education</option>
              <option value="Fun">Fun</option>
              <option value="Other">Other</option>
            </select>

            <button type="submit">Add expense</button>
            <p id="expense-error" class="error" role="alert"></p>
          </form>
        </section>

        <section aria-labelledby="cat-title">
          <h2 id="cat-title">Spending by category</h2>
          <ul id="category-list" class="category-list"></ul>
        </section>
      </div>

      <section class="right" aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title">Expenses</h2>
          <div class="row">
            <label for="filter" class="visually-hidden">Filter by category</label>
            <select id="filter">
              <option value="All">All categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Education">Education</option>
              <option value="Fun">Fun</option>
              <option value="Other">Other</option>
            </select>
            <button type="button" id="clear-all" class="secondary">Clear all</button>
          </div>
        </div>
        <ul id="expense-list" class="expense-list"></ul>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
